name: Tag

on:
  push:
    tags:
      - 'e1.*'
      - '2*'

jobs:
  set_version:
    runs-on: ubuntu-latest
    outputs:
      emqx-name: ${{ steps.set-output.outputs.emqx-name }}
    steps:
    - name: set output
      id: set-output
      run: |
        echo "emqx-name=emqx-enterprise" >> "$GITHUB_OUTPUT"

  build_ee_dashboard_package:
    uses: ./.github/workflows/build_enterprise_package.yaml
    secrets:
      VITE_CLOUD_AI_SQL_ASSISTANT_API_URL_CN: ${{ secrets.VITE_CLOUD_AI_SQL_ASSISTANT_API_URL_CN }}
      VITE_CLOUD_AI_SQL_ASSISTANT_API_URL_EN: ${{ secrets.VITE_CLOUD_AI_SQL_ASSISTANT_API_URL_EN }}

  bump_ee_dashboard_version:
    needs:
      - set_version
      - build_ee_dashboard_package
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.AUTH_APP_ID }}
          private-key: ${{ secrets.AUTH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Calculate EMQX version
        id: calc-version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Remove 'e' prefix if exists: e1.10.3 -> 1.10.3 or 2.1.5 -> 2.1.5
          version_no_prefix=${VERSION#e}
          # Extract major, minor and patch version: 1.10.3 -> 1, 10, 3
          major=$(echo $version_no_prefix | cut -d. -f1)
          minor=$(echo $version_no_prefix | cut -d. -f2)
          # Calculate EMQX version: dashboard major + 4 = emqx major
          emqx_major=$((major + 4))
          emqx_version="${emqx_major}${minor}"
          echo "emqx-version=${emqx_version}" >> "$GITHUB_OUTPUT"

      - name: Create PR in emqx/emqx
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ github.ref_name }}
          EMQX_VERSION: ${{ steps.calc-version.outputs.emqx-version }}
        run: |
          gh --repo emqx/emqx workflow run bump-dashboard-version.yaml \
            -f emqx-version=${EMQX_VERSION} \
            -f version=${VERSION}
