name: Build EMQX For Test

on:
  workflow_call:
    inputs:
      emqx-name:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EMQX_NAME: ${{ inputs.emqx-name }}
      DOCKER_LOAD: 'true'
      DOCKER_PUSH: 'false'
      # Match backend PR builds: public bases do not require dhi.io credentials.
      RUN_FROM: debian:13-slim
      DEPS_FROM: debian:13-slim

    steps:
      - name: checkout emqx code
        uses: actions/checkout@v4
        with:
          repository: emqx/emqx
          ref: release-63

      - name: Enable Docker containerd image store
        run: bash scripts/enable-docker-containerd.sh

      - uses: docker/setup-buildx-action@v4

      - name: build and export to Docker
        id: build
        run: |
          set -euo pipefail
          make "${EMQX_NAME}-docker"
          EMQX_IMAGE_TAG=$(head -n 1 .emqx_docker_image_tags)
          docker image inspect "$EMQX_IMAGE_TAG" > /dev/null
          printf '%s\n' "$EMQX_IMAGE_TAG" > "${EMQX_NAME}-docker-image-tag.txt"
          echo "EMQX_IMAGE_TAG=$EMQX_IMAGE_TAG" >> "$GITHUB_ENV"
      - name: export docker image
        run: |
          set -euo pipefail
          docker save "$EMQX_IMAGE_TAG" | gzip > "${EMQX_NAME}-docker.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: '${{ env.EMQX_NAME }}-docker'
          path: |
            ${{ env.EMQX_NAME }}-docker.tar.gz
            ${{ env.EMQX_NAME }}-docker-image-tag.txt
          if-no-files-found: error
          retention-days: 1
